[project]
name = "crenet-governance"
version = "0.1.0"
description = "Centralized governance layer and MCP compliance server for Crenet Games"
authors = [
    { name = "Emmanuel Jimenez", email = "hello@crenet.games" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["mcp-server"]
testpaths = ["tests"]
